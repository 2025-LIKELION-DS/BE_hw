<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    {% for myscrap in scraped_posts %}
    <h2><a href="{% url 'posts:detail' myscrap.id %}">{{ myscrap.title }}</a></h2>
    <p>{{ myscrap.content }}</p>
    <p>작성일 - {{ myscrap.created_at }}</p>
    <p>작성자 - {{ myscrap.author.nickname }}</p>
    {% empty %} 글이 없습니다. {% endfor %}
  </body>
</html>
